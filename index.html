<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Interno - Minimarket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center p-3 sm:p-6">

    <!-- Encabezado -->
    <header class="w-full max-w-md bg-white shadow-sm border border-slate-200 rounded-2xl p-4 mb-4 text-center">
        <h1 class="text-xl font-bold text-slate-900 flex items-center justify-center gap-2">
            <span>🛒</span> Control Minimarket
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">Sistema interno de registros</p>
    </header>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md bg-white shadow-md border border-slate-200 rounded-2xl p-5">
        
        <!-- Pestañas -->
        <div class="flex border-b border-slate-200 mb-5 text-sm font-semibold">
            <button onclick="cambiarTab('vencimientos')" id="btn-vencimientos" class="flex-1 pb-2.5 border-b-2 border-emerald-600 text-emerald-600 text-center transition-all">
                Vencimientos
            </button>
            <button onclick="cambiarTab('faltantes')" id="btn-faltantes" class="flex-1 pb-2.5 border-b-2 border-transparent text-slate-400 text-center transition-all hover:text-slate-600">
                Faltantes
            </button>
            <button onclick="cambiarTab('horas')" id="btn-horas" class="flex-1 pb-2.5 border-b-2 border-transparent text-slate-400 text-center transition-all hover:text-slate-600">
                Horas
            </button>
        </div>

        <!-- 🟢 SECCIÓN 1: VENCIMIENTOS -->
        <section id="tab-vencimientos" class="space-y-4">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-emerald-900 text-xs">
                📌 Registrá los productos con fecha límite para priorizar su exhibición o descuento.
            </div>

            <form id="form-vencimientos" onsubmit="guardarVencimiento(event)" class="space-y-4">
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Producto</label>
                    <input type="text" id="v-producto" list="lista-productos" autocomplete="off" required placeholder="Escribí para buscar producto..." 
                           class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    
                    <datalist id="lista-productos"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Fecha Vencimiento</label>
                        <input type="date" id="v-fecha" required 
                               class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Cantidad</label>
                        <input type="number" id="v-cantidad" min="1" required placeholder="Ej: 6" 
                               class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Botones en la misma solapa -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3 px-2 rounded-xl text-xs transition-all shadow-md shadow-emerald-600/20 text-center">
                        Guardar Vencimiento
                    </button>
                    <button type="button" onclick="abrirModalLista()" class="bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-bold py-3 px-2 rounded-xl text-xs transition-all border border-slate-300 flex items-center justify-center gap-1.5">
                        <span>📋</span> Ver Registrados (<span id="badge-contador">0</span>)
                    </button>
                </div>
            </form>
        </section>

        <!-- 🟠 SECCIÓN 2: FALTANTES -->
        <section id="tab-faltantes" class="space-y-4 hidden">
            <p class="text-xs text-slate-500 text-center py-4">Próximamente configuraremos Faltantes...</p>
        </section>

        <!-- 🔵 SECCIÓN 3: HORAS -->
        <section id="tab-horas" class="space-y-4 hidden">
            <p class="text-xs text-slate-500 text-center py-4">Próximamente configuraremos Horas...</p>
        </section>

    </main>

    <!-- Modal Emergente para Ver Registros del Sheet -->
    <div id="modal-lista" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 border border-slate-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span>📋</span> Vencimientos en Google Sheet
                </h3>
                <button onclick="cerrarModalLista()" class="text-slate-400 hover:text-slate-600 font-bold text-sm px-2 py-1 rounded-lg">
                    ✕
                </button>
            </div>
            
            <div id="contenedor-lista" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
                <!-- Se llena dinámicamente desde el Sheet -->
            </div>

            <button onclick="cerrarModalLista()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <span id="toast-icon">✅</span>
        <span id="toast-mensaje">Registro guardado</span>
    </div>

        document.addEventListener('DOMContentLoaded', () => {
            const datalist = document.getElementById('lista-productos');
            productosBase.forEach(prod => {
                const option = document.createElement('option');
                option.value = prod;
                datalist.appendChild(option);
            });
            actualizarContador();
        });

        function cambiarTab(tab) {
            ['vencimientos', 'faltantes', 'horas'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                const btn = document.getElementById('btn-' + t);
                btn.className = "flex-1 pb-2.5 border-b-2 border-transparent text-slate-400 text-center transition-all hover:text-slate-600 font-semibold";
            });

            document.getElementById('tab-' + tab).classList.remove('hidden');
            const btnActivo = document.getElementById('btn-' + tab);
            
            const colores = { vencimientos: 'emerald', faltantes: 'amber', horas: 'blue' };
            const c = colores[tab];
            btnActivo.className = `flex-1 pb-2.5 border-b-2 border-${c}-600 text-${c}-600 text-center font-semibold transition-all`;
        }

        async function guardarVencimiento(e) {
            e.preventDefault();

            const btnSubmit = e.target.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Guardando...";

            const datos = {
                accion: "guardarVencimiento",
                tipo: "Vencimientos",
                producto: document.getElementById('v-producto').value,
                fechaVencimiento: document.getElementById('v-fecha').value,
                cantidad: document.getElementById('v-cantidad').value,
                timestamp: new Date().toLocaleString("es-AR")
            };

            try {
                await fetch(URL_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                mostrarToast("¡Vencimiento guardado!", "✅");
                document.getElementById('form-vencimientos').reset();
                actualizarContador();

            } catch (error) {
                console.error("Error al guardar:", error);
                mostrarToast("Hubo un error al guardar", "❌");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Guardar Vencimiento";
            }
        }

        function abrirModalLista() {
            document.getElementById('modal-lista').classList.remove('hidden');
            cargarVencimientosDesdeSheet();
        }

        function cerrarModalLista() {
            document.getElementById('modal-lista').classList.add('hidden');
        }

        async function cargarVencimientosDesdeSheet() {
            const contenedor = document.getElementById('contenedor-lista');
            contenedor.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Cargando desde Google Sheets...</p>`;

            try {
                const res = await fetch(`${URL_SCRIPT}?accion=obtenerVencimientos`);
                const lista = await res.json();
                renderizarListaModal(lista);
                document.getElementById('badge-contador').textContent = lista.length;
            } catch (err) {
                console.error("Error al leer Sheet:", err);
                contenedor.innerHTML = `<p class="text-xs text-rose-500 text-center py-6">Error al cargar registros del Sheet.</p>`;
            }
        }

        function renderizarListaModal(guardados) {
            const contenedor = document.getElementById('contenedor-lista');
            contenedor.innerHTML = '';

            if (!guardados || guardados.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No hay vencimientos cargados en la planilla.</p>`;
                return;
            }

            guardados.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-2 text-xs";
                card.innerHTML = `
                    <div class="space-y-0.5">
                        <p class="font-bold text-slate-800">${item.producto}</p>
                        <p class="text-slate-500">📅 Vence: <span class="font-semibold text-rose-600">${item.fechaVencimiento}</span> | Cant: <span class="font-semibold">${item.cantidad}</span></p>
                    </div>
                    <button onclick="eliminarVencimientoDelSheet(${item.fila})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2 rounded-lg transition-all font-bold" title="Eliminar del Sheet">
                        🗑️
                    </button>
                `;
                contenedor.appendChild(card);
            });
        }

        async function eliminarVencimientoDelSheet(numFila) {
            if (!confirm("¿Seguro que querés eliminar esta fila del Sheet?")) return;

            try {
                await fetch(URL_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: "eliminarVencimiento", fila: numFila })
                });

                mostrarToast("Producto eliminado del Sheet", "🗑️");
                setTimeout(cargarVencimientosDesdeSheet, 1000); // Recargar lista
            } catch (err) {
                console.error(err);
                mostrarToast("Error al eliminar", "❌");
            }
        }

        async function actualizarContador() {
            try {
                const res = await fetch(`${URL_SCRIPT}?accion=obtenerVencimientos`);
                const lista = await res.json();
                document.getElementById('badge-contador').textContent = lista.length;
            } catch (e) {}
        }

        function mostrarToast(mensaje, icono = "✅") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-mensaje').textContent = mensaje;
            document.getElementById('toast-icon').textContent = icono;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
