<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minimarket">
    <title>Control Interno - Minimarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col items-center p-3 sm:p-6 transition-colors duration-200">

    <header class="w-full max-w-md bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 rounded-2xl p-4 mb-4 flex justify-between items-center transition-colors">
        <div>
            <h1 class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <span aria-hidden="true">🛒</span> Control Minimarket
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Sistema interno de registros</p>
        </div>
        <button type="button" id="btn-tema" aria-label="Cambiar tema"
                class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 p-2.5 rounded-xl transition-all outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
            <span id="icono-tema" aria-hidden="true">🌙</span>
        </button>
    </header>

    <main class="w-full max-w-md bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 rounded-2xl p-5 transition-colors">

        <section id="tab-vencimientos" aria-labelledby="titulo-vencimientos" class="space-y-4">
            <h2 id="titulo-vencimientos" class="text-sm font-bold text-emerald-700 dark:text-emerald-400 border-b-2 border-emerald-600 dark:border-emerald-500 pb-2.5">Vencimientos</h2>
            <div class="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl p-3 text-emerald-900 dark:text-emerald-300 text-xs">
                <span aria-hidden="true">📌</span> Registrá o editá los productos con fecha límite para priorizar su exhibición o descuento.
            </div>

            <div id="resumen" role="group" aria-label="Ver lista de vencimientos" class="grid grid-cols-3 gap-2"></div>

            <form id="form-vencimientos" class="space-y-4" novalidate>
                <input type="hidden" id="v-id" value="">

                <div>
                    <label for="v-producto" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Producto</label>
                    <input type="text" id="v-producto" list="lista-productos" autocomplete="off" autocapitalize="characters"
                           maxlength="120" required placeholder="Escribí para buscar producto..."
                           class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    <datalist id="lista-productos"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="v-fecha" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Fecha Vencimiento</label>
                        <input type="date" id="v-fecha" required
                               class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    </div>
                    <div>
                        <label for="v-cantidad" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Cantidad</label>
                        <input type="number" id="v-cantidad" min="1" max="100000" step="1" inputmode="numeric" required placeholder="Ej: 6"
                               class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="btn-submit" data-texto="Guardar Vencimiento"
                            class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] disabled:opacity-60 disabled:cursor-wait text-white font-bold py-3 px-2 rounded-xl text-sm transition-all shadow-md shadow-emerald-600/20 text-center focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2 outline-none">
                        Guardar Vencimiento
                    </button>
                    <button type="button" id="btn-cancelar-edicion" class="hidden bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold py-3 px-3 rounded-xl text-xs transition-all outline-none">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

    </main>

    <!-- Modal -->
    <div id="modal-lista" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50"
         role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-700 transition-colors">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h2 id="modal-titulo" class="font-bold text-slate-800 dark:text-slate-100 text-sm flex items-center gap-2">
                    <span aria-hidden="true">📋</span> Vencimientos registrados
                </h2>
                <button type="button" id="btn-cerrar-x" aria-label="Cerrar"
                        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold text-sm px-2 py-1 rounded-lg focus-visible:ring-2 focus-visible:ring-slate-400 outline-none">
                    <span aria-hidden="true">✕</span>
                </button>
            </div>

            <div id="filtros" role="group" aria-label="Filtrar lista" class="flex flex-wrap gap-1.5">
                <button type="button" data-pill="todos"></button>
                <button type="button" data-pill="vencidos"></button>
                <button type="button" data-pill="proximos"></button>
            </div>

            <input type="search" id="buscar" autocomplete="off" aria-label="Buscar producto en la lista" placeholder="Buscar producto en la lista..."
                   class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">

            <div id="contenedor-lista" class="space-y-2 h-[45vh] min-h-[200px] max-h-[400px] overflow-y-auto pr-1" aria-live="polite"></div>

            <button type="button" id="btn-cerrar"
                    class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs transition-all focus-visible:ring-2 focus-visible:ring-slate-500 outline-none">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"
         class="fixed bottom-5 left-1/2 -translate-x-1/2 max-w-[90vw] bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <span id="toast-icon" aria-hidden="true">✅</span>
        <span id="toast-mensaje"></span>
    </div>

    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>

    <script src="productos.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
